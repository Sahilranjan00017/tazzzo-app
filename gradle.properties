kotlin.code.style=official
# Right-sized for a single-module project on an 8 GB host. The previous 4 GB
# heap + 1 GB metaspace took half the machine and, alongside the emulator,
# pushed macOS into 4.6 GB of swap and repeated emulator OOM kills — which is
# what made the instrumented suite flake. 2 GB builds this project comfortably.
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536M
org.gradle.caching=true
# Off: one module gains nothing from parallel workers, and each worker is
# another JVM competing with the emulator for memory.
org.gradle.parallel=false
kotlin.native.enableKlibsCrossCompilation=true
android.useAndroidX=true
